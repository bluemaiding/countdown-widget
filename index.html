<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Countdown</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: transparent;
            user-select: none;
            -webkit-app-region: drag;
            overflow: hidden;
        }

        :root {
            --bg: #1e1e2eee;
            --border: #ffffff11;
            --text: #eee;
            --text2: #999;
            --text3: #666;
            --accent: #7F5AF0;
            --accent2: #2CB5E8;
            --btn-bg: #ffffff15;
            --btn-hover: #ffffff25;
            --shadow: rgba(0,0,0,0.5);
            --picker-bg: #ffffff0a;
            --picker-active: #ffffff18;
        }
        :root.light {
            --bg: #f0f0f5ee;
            --border: #00000010;
            --text: #1a1a2e;
            --text2: #666;
            --text3: #999;
            --accent: #6B46E5;
            --accent2: #1A9FD8;
            --btn-bg: #00000008;
            --btn-hover: #00000015;
            --shadow: rgba(0,0,0,0.12);
            --picker-bg: #00000006;
            --picker-active: #00000010;
        }

        #container {
            width: 300px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 40px var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* ── Title bar ── */
        #titlebar {
            display: flex; align-items: center; justify-content: center;
            padding: 14px 18px 6px; position: relative;
        }
        #titletext { color: var(--text2); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        #btn-close, #btn-refresh {
            position: absolute; top: 12px;
            width: 24px; height: 24px; border: none; background: transparent;
            color: var(--text3); font-size: 14px; cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            -webkit-app-region: no-drag; transition: all 0.15s; line-height: 1;
        }
        #btn-close { right: 14px; font-size: 16px; }
        #btn-refresh { left: 14px; }
        #btn-close:hover { background: #e81123; color: #fff; }
        #btn-refresh:hover { background: var(--btn-hover); color: var(--text); }

        /* ── Event name ── */
        #eventname { color: var(--text); font-size: 18px; font-weight: 700; text-align: center; margin: 8px 0 14px; }

        /* ── Timer ── */
        #timerow { display: flex; justify-content: center; align-items: flex-start; gap: 2px; padding: 0 24px; }
        .timer-unit { text-align: center; flex: 1; }
        .timer-unit .num {
            font-size: 50px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1.1; font-variant-numeric: tabular-nums;
        }
        .timer-unit .label { font-size: 11px; color: var(--text3); }
        .sep { font-size: 36px; color: var(--text3); padding-top: 4px; flex: 0; opacity: 0.4; }

        /* ── Controls ── */
        #controls { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0 4px; }
        .ctrl-btn {
            border: none; background: var(--btn-bg); color: var(--text2); cursor: pointer;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; -webkit-app-region: no-drag;
        }
        .ctrl-btn:hover { background: var(--btn-hover); color: var(--text); }
        #btn-pause { width: 40px; height: 40px; font-size: 18px; }
        #btn-theme { width: 30px; height: 30px; font-size: 14px; }
        #btn-mini { width: 30px; height: 30px; font-size: 14px; }

        /* ── Progress ── */
        #progress-wrap { margin: 8px 18px 0; position: relative; }
        #progress-bar { height: 3px; background: var(--btn-bg); border-radius: 2px; overflow: hidden; }
        #progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width 1s linear; }
        #progress-pct {
            position: absolute; right: 0; top: -16px;
            font-size: 10px; color: var(--text3); font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        #setinfo { color: var(--text3); font-size: 11px; text-align: center; margin-top: 8px; }

        /* ── Settings ── */
        #settings { margin: 10px 18px; display: none; overflow-y: auto; max-height: 260px; }
        #input-name {
            width: 100%; padding: 8px 10px;
            background: var(--picker-bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 13px;
            outline: none; margin-bottom: 10px;
            -webkit-app-region: no-drag;
        }
        #input-name:focus { border-color: var(--accent); }
        #input-name::placeholder { color: var(--text3); }

        /* ── Time picker ── */
        .picker-row {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; margin-bottom: 10px; -webkit-app-region: no-drag;
        }
        .picker-col {
            display: flex; flex-direction: column; align-items: center;
            gap: 0; flex: 1; position: relative;
        }
        .picker-btn {
            width: 100%; height: 26px; border: none; background: transparent;
            color: var(--text2); cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.1s;
        }
        .picker-btn:hover { color: var(--text); }
        .picker-val {
            width: 100%; height: 36px; display: flex; align-items: center; justify-content: center;
            background: var(--picker-active); border-radius: 8px;
            font-size: 22px; font-weight: 700; color: var(--text);
            font-variant-numeric: tabular-nums;
        }
        .picker-label { font-size: 10px; color: var(--text3); margin-top: 2px; }
        .picker-sep { font-size: 24px; color: var(--text3); padding-bottom: 18px; }

        #save-btn {
            width: 100%; padding: 8px; background: var(--accent); color: #fff;
            border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; -webkit-app-region: no-drag; transition: opacity 0.15s;
            white-space: nowrap;
        }
        #save-btn:hover { opacity: 0.85; }

        #toggle-btn {
            display: block; width: 100%; padding: 8px 0 6px; background: transparent;
            border: none; color: var(--text3); font-size: 11px; cursor: pointer;
            text-align: center; -webkit-app-region: no-drag; margin: 4px 0 0;
            transition: color 0.15s;
        }
        #toggle-btn:hover { color: var(--text2); }

        /* ── Paused ── */
        .paused .num { -webkit-text-fill-color: #ff6b6b !important; background: none !important; }
        #btn-pause.playing .icon-pause { display: inline; }
        #btn-pause.playing .icon-play  { display: none; }
        #btn-pause.stopped .icon-pause { display: none; }
        #btn-pause.stopped .icon-play  { display: inline; }

        /* ── Mini ── */
        #container.mini {
            width: 220px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; background: var(--bg);
            padding: 0 10px; gap: 6px; overflow: hidden;
        }
        #container.mini #eventname, #container.mini #timerow,
        #container.mini #progress-wrap, #container.mini #setinfo,
        #container.mini #settings, #container.mini #toggle-btn,
        #container.mini #titlebar, #container.mini #controls { display: none !important; }
        #mini-bar { display: none; align-items: center; width: 100%; gap: 4px; }
        #container.mini #mini-bar { display: flex; }
        #mini-timer {
            color: var(--text); font-size: 17px; font-weight: 700;
            font-variant-numeric: tabular-nums; letter-spacing: 1px;
            flex: 1; -webkit-app-region: drag; padding-left: 2px;
        }
        .mini-btn {
            width: 28px; height: 28px; border: none; background: transparent;
            color: var(--text3); font-size: 13px; cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            -webkit-app-region: no-drag; transition: all 0.15s; flex-shrink: 0;
        }
        .mini-btn:hover { background: var(--btn-hover); color: var(--text); }
        .mini-btn.close-btn:hover { background: #e81123; color: #fff; }
    </style>
</head>
<body>
    <div id="container">
        <div id="titlebar">
            <button id="btn-refresh" title="刷新">↻</button>
            <span id="titletext">COUNTDOWN</span>
            <button id="btn-close" title="关闭">✕</button>
        </div>
        <div id="eventname">距离目标还有</div>
        <div id="timerow">
            <div class="timer-unit"><div class="num" id="hours">00</div><div class="label">时</div></div>
            <div class="sep">:</div>
            <div class="timer-unit"><div class="num" id="mins">00</div><div class="label">分</div></div>
            <div class="sep">:</div>
            <div class="timer-unit"><div class="num" id="secs">00</div><div class="label">秒</div></div>
        </div>
        <div id="controls">
            <button class="ctrl-btn" id="btn-mini" title="迷你模式">⤡</button>
            <button class="ctrl-btn playing" id="btn-pause" title="暂停/继续">
                <span class="icon-pause">⏸</span><span class="icon-play">▶</span>
            </button>
            <button class="ctrl-btn" id="btn-theme" title="切换主题">☀</button>
        </div>
        <div id="progress-wrap">
            <span id="progress-pct">0%</span>
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div id="setinfo"></div>
        <div id="settings">
            <input type="text" id="input-name" placeholder="事件名称（可选）">
            <div class="picker-row">
                <div class="picker-col">
                    <button class="picker-btn" data-col="h" data-dir="1">▲</button>
                    <div class="picker-val" id="pick-h">09</div>
                    <button class="picker-btn" data-col="h" data-dir="-1">▼</button>
                    <span class="picker-label">时</span>
                </div>
                <span class="picker-sep">:</span>
                <div class="picker-col">
                    <button class="picker-btn" data-col="m" data-dir="1">▲</button>
                    <div class="picker-val" id="pick-m">00</div>
                    <button class="picker-btn" data-col="m" data-dir="-1">▼</button>
                    <span class="picker-label">分</span>
                </div>
            </div>
            <button id="save-btn">设定目标</button>
        </div>
        <button id="toggle-btn">设置目标 ▾</button>
        <div id="mini-bar">
            <span id="mini-timer">00:00:00</span>
            <button class="mini-btn" id="mini-pause" title="暂停/继续">⏸</button>
            <button class="mini-btn" id="mini-expand" title="展开">⤡</button>
            <button class="mini-btn close-btn" id="mini-close" title="关闭">✕</button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const $ = id => document.getElementById(id);
        let target = null, startTime = null, paused = false, pausedDuration = 0, pauseStart = null;
        const container = $('container');

        // ── Theme ──
        let currentTheme = ipcRenderer.sendSync('get-theme');
        function applyTheme(t) {
            document.documentElement.classList.toggle('light', t === 'light');
            $('btn-theme').textContent = t === 'light' ? '☾' : '☀';
        }
        applyTheme(currentTheme);
        $('btn-theme').addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
            ipcRenderer.send('save-theme', currentTheme);
        });

        // ── Picker state ──
        let pickH = 9, pickM = 0;
        function updatePickerDisplay() {
            $('pick-h').textContent = String(pickH).padStart(2, '0');
            $('pick-m').textContent = String(pickM).padStart(2, '0');
        }
        document.querySelectorAll('.picker-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const col = btn.dataset.col;
                const dir = parseInt(btn.dataset.dir);
                if (col === 'h') { pickH = (pickH + dir + 24) % 24; }
                else { pickM = (pickM + dir + 60) % 60; }
                updatePickerDisplay();
            });
        });
        // Scroll wheel support on picker values
        ['pick-h', 'pick-m'].forEach(id => {
            $(id).addEventListener('wheel', (e) => {
                e.preventDefault();
                const dir = e.deltaY > 0 ? -1 : 1;
                if (id === 'pick-h') { pickH = (pickH + dir + 24) % 24; }
                else { pickM = (pickM + dir + 60) % 60; }
                updatePickerDisplay();
            }, { passive: false });
        });

        // ── Data ──
        function loadData() {
            ipcRenderer.invoke('load-data').then(data => {
                if (data && data.target) {
                    target = new Date(data.target);
                    startTime = data.start ? new Date(data.start) : null;
                    $('eventname').textContent = data.name || '距离目标还有';
                    $('setinfo').textContent = '目标: ' + formatTarget(target);
                }
            });
        }
        function formatTarget(d) {
            const p = n => String(n).padStart(2, '0');
            return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        function pad(n) { return String(n).padStart(2, '0'); }

        // ── Tick ──
        function tick() {
            if (!target || paused) return;
            const now = new Date();
            let diff = target - now;
            if (diff <= 0) { diff = 0; $('eventname').textContent = '🎉 时间到！'; }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            $('hours').textContent = pad(h);
            $('mins').textContent = pad(m);
            $('secs').textContent = pad(s);
            $('mini-timer').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
            if (startTime && target > startTime) {
                const elapsed = now - startTime - pausedDuration;
                const pct = Math.min(100, Math.max(0, elapsed / (target - startTime) * 100));
                $('progress-fill').style.width = pct + '%';
                $('progress-pct').textContent = Math.round(pct) + '%';
            }
        }

        // ── Buttons ──
        $('btn-close').addEventListener('click', () => ipcRenderer.send('close'));
        $('btn-refresh').addEventListener('click', () => {
            target = null; startTime = null; paused = false; pausedDuration = 0; pauseStart = null;
            $('eventname').textContent = '距离目标还有';
            $('setinfo').textContent = '';
            $('hours').textContent = '00';
            $('mins').textContent = '00';
            $('secs').textContent = '00';
            $('mini-timer').textContent = '00:00:00';
            $('progress-fill').style.width = '0%';
            $('progress-pct').textContent = '0%';
            container.classList.remove('paused');
            btnPause.classList.remove('stopped');
            btnPause.classList.add('playing');
            miniPause.textContent = '⏸';
            ipcRenderer.send('save-data', {});
        });
        const btnPause = $('btn-pause'), miniPause = $('mini-pause');
        function setPausedState(p) {
            paused = p;
            if (p) {
                pauseStart = Date.now();
            } else {
                if (pauseStart) pausedDuration += Date.now() - pauseStart;
                pauseStart = null;
                if (pausedDuration > 0 && target && startTime) {
                    target = new Date(target.getTime() + pausedDuration);
                    startTime = new Date(startTime.getTime() + pausedDuration);
                    pausedDuration = 0;
                    ipcRenderer.send('save-data', { target: target.toISOString(), start: startTime.toISOString(), name: $('eventname').textContent });
                }
            }
            container.classList.toggle('paused', p);
            btnPause.classList.toggle('playing', !p);
            btnPause.classList.toggle('stopped', p);
            miniPause.textContent = p ? '▶' : '⏸';
        }
        btnPause.addEventListener('click', () => { if (target) setPausedState(!paused); });
        miniPause.addEventListener('click', () => { if (target) setPausedState(!paused); });
        $('btn-mini').addEventListener('click', () => { container.classList.add('mini'); ipcRenderer.send('resize', true); });
        $('mini-expand').addEventListener('click', () => { container.classList.remove('mini'); ipcRenderer.send('resize', false); });
        $('mini-close').addEventListener('click', () => ipcRenderer.send('close'));

        // ── Settings ──
        let settingsOpen = false;
        $('toggle-btn').addEventListener('click', () => {
            settingsOpen = !settingsOpen;
            $('settings').style.display = settingsOpen ? 'block' : 'none';
            $('toggle-btn').textContent = settingsOpen ? '收起设置 ▴' : '设置目标 ▾';
        });

        $('save-btn').addEventListener('click', () => {
            const name = $('input-name').value.trim() || '倒计时';
            const now = new Date();
            const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), pickH, pickM, 0);
            if (t <= now) t.setDate(t.getDate() + 1);
            target = t;
            startTime = now;
            pausedDuration = 0;
            pauseStart = null;
            $('eventname').textContent = name;
            $('setinfo').textContent = '目标: ' + formatTarget(target);
            ipcRenderer.send('save-data', { target: target.toISOString(), start: startTime.toISOString(), name });
            settingsOpen = false;
            $('settings').style.display = 'none';
            $('toggle-btn').textContent = '设置目标 ▾';
            setPausedState(false);
        });

        loadData();
        setInterval(tick, 500);
        tick();
    </script>
</body>
</html>
